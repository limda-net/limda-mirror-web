name: Deploy _site to VPS

on:
  push:
    branches:
      - limda
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout limda branch
        uses: actions/checkout@v4
        with:
          ref: limda

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build _site with Docker
        run: |
          docker build -t site-builder -f Dockerfile.build .
          docker run -it -v $(pwd):/data:rw site-builder

      - name: Copy _site to VPS via SSH
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          port: ${{ secrets.VPS_PORT }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          source: "_site"
          target: ${{ secrets.VPS_TARGET_PATH }}
          overwrite: true