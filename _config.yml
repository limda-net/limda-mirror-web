# Welcome to Jekyll!
#
# This config file is meant for settings that affect your whole blog, values
# which you are expected to set up once and rarely need to edit after that.
# For technical reasons, this file is *NOT* reloaded automatically when you use
# 'jekyll serve'. If you change this file, please restart the server process.

# Site settings
title: Limda Host Mirror
school: Limda Host
brand: Limda Host
keyword: Linux Host,Mirror Site,Linux,Opensource
operator: Limda Host
author: Limda Host
desc: Limda Host Mirror is a reliable and high-speed mirror service that provides access to a wide range of Linux distributions and open-source software. It is designed to meet the needs of developers, researchers, and users who require fast and efficient access to software packages and updates.

logo: true
meow_404: true
issue_tag: mirror
baseurl: "" # e.g. /blog
permalink: "/:categories/:title/"
base: ""
url: "https://mirror.limda.net"
hostname: "mirror.limda.net"
urlv4: "https://mirror4.limda.net"
urlv6: "https://mirror6.limda.net"
homelink: "https://limda.net"
hide_navbar: false
hide_download: false
hide_server_status: false

# Build settings
highlighter: rouge
markdown: kramdown
kramdown:
    input: GFM
    hard_wrap: false


sass:
    sass_dir: static/css

plugins:
    - jekyll-babel
    - jekyll-sitemap
    - jekyll/fontawesome/svg
    - jekyll-minifier

babel_js_extensions: 'es6'

exclude: [Gemfile, Gemfile.lock, README.md, gen_robot.sh, vendor, geninfo/, gen_desc.py, Dockerfile*, build.sh]

# Generated at runtime on the server, NOT from this repo. A Jekyll build wipes
# anything in the destination that is not in the source, so without this the
# Grafana status PNGs and the access-protected traffic report are deleted on
# every deploy and stay missing until the next 3-hourly cron run.
keep_files:
  - static/status
  - private